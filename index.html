<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videostar PC - Inserts rápidos y fáciles - Descargar ahora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue:  #1a4fff;
            --blue2: #3a6fff;
            --blue3: #5588ff;
        }

        html, body { height: 100%; }

        body {
            min-height: 100vh;
            font-family: 'Barlow', sans-serif;
            background: #000b1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(26,79,255,0.35) 0%, transparent 70%);
            top: -100px; left: -100px;
            animation: drift1 12s ease-in-out infinite;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(58,111,255,0.2) 0%, transparent 70%);
            bottom: -80px; right: -80px;
            animation: drift2 15s ease-in-out infinite;
        }
        .blob-3 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(85,136,255,0.15) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: drift3 8s ease-in-out infinite;
        }

        @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,30px)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,-40px)} }
        @keyframes drift3 {
            0%,100% { transform:translate(-50%,-50%) scale(1) }
            50%      { transform:translate(-50%,-50%) scale(1.3) }
        }

        .glass-card {
            position: relative;
            z-index: 10;
            width: min(500px, 92vw);
            padding: 56px 52px 52px;
            border-radius: 28px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow:
                0 0 0 0.5px rgba(26,79,255,0.25),
                0 32px 80px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.12);
            text-align: center;
            animation: appear .7s cubic-bezier(.22,1,.36,1) both;
            overflow: hidden;
        }

        @keyframes appear {
            from { opacity:0; transform:translateY(28px) scale(.97); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 50%);
            pointer-events: none;
        }

        @keyframes scanline { 0%{top:-2px} 100%{top:100%} }
        .glass-card::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100,150,255,0.25), transparent);
            animation: scanline 7s linear infinite;
            pointer-events: none;
        }

        .logo {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 64px;
            line-height: 1;
            letter-spacing: -.01em;
            margin-bottom: 4px;
        }
        .logo .v    { color: var(--blue2); }
        .logo .s    { color: var(--blue3); }
        .logo .star { color: var(--blue3); font-size: 48px; vertical-align: middle; margin-left: 2px; }

        .logo-sub {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: rgba(150,180,255,0.45);
            margin-bottom: 36px;
        }

        .divider {
            width: 40px; height: 2px;
            background: linear-gradient(90deg, var(--blue), var(--blue3));
            border-radius: 999px;
            margin: 0 auto 32px;
            opacity: .6;
        }

        .tagline {
            font-size: 17px;
            font-weight: 300;
            color: rgba(200,220,255,0.65);
            line-height: 1.6;
            margin-bottom: 44px;
        }
        .tagline strong { color: rgba(220,235,255,0.95); font-weight: 500; }

        .btn-dl {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 17px 28px;
            border-radius: 14px;
            background: var(--blue);
            color: #fff;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: .05em;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform .15s, box-shadow .15s;
            box-shadow: 0 4px 24px rgba(26,79,255,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
        }
        .btn-dl::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, transparent 55%);
            pointer-events: none;
        }
        .btn-dl:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 36px rgba(26,79,255,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn-dl:active { transform: translateY(0); }

        .meta {
            margin-top: 20px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: rgba(150,180,255,0.3);
            letter-spacing: .08em;
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="glass-card">

        <div class="logo">
            <img src="logo-white.png" style="width:90%">
        </div>
        <div class="logo-sub">Inserts rápidos y fáciles</div>

        <div class="divider"></div>

        <p class="tagline">
            Creá inserts de video con imágenes y exportalos<br>
            directo a <strong>MP4</strong> desde tu computadora.
        </p>

        <a href="https://drive.google.com/file/d/12CXszzqsk1gXaIYbCsk4anqVxDTIHyPq/view?usp=drive_link" class="btn-dl">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Descargar gratis
        </a>

        <p class="meta">desde Google Drive</p>

    </div>

</body>
</html>
